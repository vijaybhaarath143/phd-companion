<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhD Companion · Ask Sprig: full UI flow (design prototype)</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #pcf {
    /* Product tokens: src/app/globals.css (light), master cad160b */
    --bg: #fbfaf6; --fg: #2d2d33; --card: #ffffff; --muted: #f3f1eb; --muted-fg: #5d5d65;
    --border: #e6e4de; --primary: #268519; --primary-fg: #ffffff; --primary-edge: #1b6411;
    --ring: #1872b3; --destructive: #b42323;
    --attention: #fff3c4; --attention-border: #f5de8a; --attention-fg: #6e4600;
    --leaf-soft: #e4f6dc; --leaf-strong: #1b6411; --leaf-line: #bfe5b0;
    --sky: #1872b3; --sky-soft: #e3f2fd; --sky-strong: #0f5a8f;
    --grape: #7a4fd0; --grape-soft: #f1eafe; --grape-strong: #5b35a8;
    --clay: #b04a12; --clay-soft: #ffeadf; --clay-strong: #8e3a0c; --clay-line: #f4c6ad; --sun-strong: #9a6300;
    --z50: #f8f7f3; --z100: #f3f1eb; --z300: #d6d3cb; --z400: #a8a6a0; --z700: #4a4a52; --z900: #2d2d33;
    --font-display: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-family: var(--font-sans); color: var(--fg); font-size: 15px; line-height: 1.45;
    max-width: 1120px; margin: 0 auto;
  }
  #pcf *, #pcf *::before, #pcf *::after { box-sizing: border-box; }
  :where(#pcf button, #pcf input, #pcf select, #pcf textarea) { font: inherit; color: inherit; }
  #pcf button { cursor: pointer; }
  #pcf button:disabled { cursor: not-allowed; }
  #pcf :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; box-shadow: 0 0 0 5px var(--sky-soft); }
  #pcf .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #pcf h2, #pcf h3, #pcf h4 { font-family: var(--font-display); font-weight: 800; margin: 0; }
  #pcf p { margin: 0; }
  #pcf svg { flex-shrink: 0; }
  #pcf [hidden] { display: none !important; }

  /* ================= Reviewer layer (prototype only) ================= */
  .rv { background: #fffdf7; border: 2px dashed #cfcabd; border-radius: 14px; padding: 8px 10px 10px; margin: 0 0 12px; font-size: 13.5px; color: #2d2d33; }
  .rv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .rv-tag { font-family: var(--font-display); font-weight: 800; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #5d5d65; white-space: nowrap; }
  .rv-tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1 1 240px; min-width: 0; }
  .rv-tab, .rv-btn { flex-shrink: 0; white-space: nowrap; }
  .rv-tab { height: 32px; padding: 0 11px; border-radius: 9px; border: 2px solid #e2ded3; background: #fff; font-size: 13px; font-weight: 700; color: #3c3c44; }
  .rv-tab[aria-selected="true"] { background: #2d2d33; border-color: #2d2d33; color: #fff; }
  .rv-btn { height: 32px; padding: 0 11px; border-radius: 9px; border: 2px solid #e2ded3; background: #fff; font-size: 13px; font-weight: 700; color: #3c3c44; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .rv-btn:hover { background: #f6f4ee; }
  .rv-btn:disabled { opacity: .5; }
  .rv-btn.dark { background: #2d2d33; border-color: #2d2d33; color: #fff; }
  .rv-panel { margin-top: 8px; display: flex; flex-direction: column; gap: 7px; }
  .rv-row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .rv-row label { font-weight: 700; font-size: 12.5px; }
  .rv select { height: 32px; border-radius: 9px; border: 2px solid #e2ded3; background: #fff; padding: 0 8px; font-size: 13px; max-width: 100%; min-width: 0; flex: 1 1 220px; }
  .rv-count { font-size: 12px; color: #5d5d65; white-space: nowrap; }
  .rv-line { font-size: 13px; color: #3c3c44; overflow-wrap: anywhere; }
  .rv-line b { font-weight: 800; color: #2d2d33; }
  .rv-groups { display: flex; flex-wrap: wrap; gap: 4px; }
  .rv-group { height: 30px; padding: 0 9px; border-radius: 999px; border: 2px solid #e2ded3; background: #fff; font-size: 12.5px; font-weight: 700; color: #3c3c44; }
  .rv-group[aria-pressed="true"] { border-color: #2d2d33; background: #f1efe8; }
  .rv-cases { display: flex; flex-wrap: wrap; gap: 4px; }
  .rv-case { min-height: 30px; padding: 3px 9px; border-radius: 9px; border: 2px solid #e8e5dc; background: #fff; font-size: 12.5px; font-weight: 600; color: #2d2d33; text-align: left; }
  .rv-case:hover { background: #f6f4ee; }
  .rv-case[aria-current="true"] { border-color: var(--sky); background: var(--sky-soft); color: var(--sky-strong); }
  .rv-sim { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 8px; border-radius: 9px; background: #f1efe8; font-size: 12.5px; }
  .rv-map { display: flex; flex-wrap: wrap; align-items: stretch; gap: 4px 2px; }
  .rv-node { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 3px 4px; border-radius: 10px; border: 2px solid #e8e5dc; background: #fff; font-size: 11.5px; font-weight: 700; color: #2d2d33; line-height: 1.15; text-align: center; }
  .rv-node:hover { background: #f6f4ee; }
  .rv-node[aria-current="true"] { border-color: var(--sky); background: var(--sky-soft); }
  .rv-node svg { width: 64px; height: 42px; }
  .rv-arrow { display: flex; align-items: center; color: #a8a6a0; font-size: 14px; width: 10px; justify-content: center; }
  .rv-branches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; }

  /* ================= Product ================= */
  .pcf-stage { container: pc / inline-size; max-width: 100%; margin: 0 auto; }
  .pcf-stage.phone { max-width: 380px; }
  .pcf-device-note { text-align: center; font-size: 12px; color: #5d5d65; margin: 0 0 6px; }
  .tile svg { width: 17px; height: 17px; }
  .badge svg { width: 13px; height: 13px; }

  .pc-app { position: relative; background: var(--bg); border: 2px solid var(--border); border-radius: 20px; box-shadow: 0 4px 0 var(--border); overflow: hidden; display: flex; flex-direction: column; height: 720px; }
  .pc-preview-bar { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 5px 14px; background: var(--attention); border-bottom: 2px solid var(--attention-border); color: var(--attention-fg); font-size: 12.5px; flex-shrink: 0; }
  .pc-preview-bar strong { font-family: var(--font-display); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; white-space: nowrap; }
  .pc-preview-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun-strong); flex-shrink: 0; }
  .pc-body { flex: 1; min-height: 0; display: flex; position: relative; }

  .pc-rail { display: none; width: 68px; flex-shrink: 0; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; background: var(--card); border-right: 2px solid var(--border); overflow: hidden; }
  .pc-rail .brand { width: 38px; margin: 0 0 10px; display: block; }
  .pc-rail-item { width: 48px; height: 44px; border-radius: 12px; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; opacity: .55; }
  .pc-rail-item.cur { background: var(--sky-soft); border-color: var(--sky-soft); opacity: 1; }
  .pc-rail .sep { width: 32px; height: 2px; background: var(--z100); margin: 6px 0; }
  .tile { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .t-leaf { background: var(--leaf-soft); color: var(--primary); }
  .t-sky { background: var(--sky-soft); color: var(--sky); }
  .t-sun { background: var(--attention); color: var(--sun-strong); }
  .t-grape { background: var(--grape-soft); color: var(--grape); }
  .t-clay { background: var(--clay-soft); color: var(--clay); }
  .t-neutral { background: var(--muted); color: var(--z700); }

  /* Inbox */
  .pc-inbox { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); }
  .pc-inbox-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 2px solid var(--z100); }
  .pc-inbox-title { display: flex; align-items: center; gap: 10px; }
  .pc-inbox-title .mark { width: 30px; flex-shrink: 0; }
  .pc-inbox-title h2 { font-size: 20px; line-height: 1.1; flex: 1; min-width: 0; white-space: nowrap; }
  .eyebrow { display: block; font-family: var(--font-display); font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
  .pc-search { position: relative; }
  .pc-search > svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted-fg); pointer-events: none; }
  .pc-search input { width: 100%; height: 40px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); padding: 0 12px 0 34px; font-size: 14.5px; }
  .pc-search input::placeholder { color: var(--muted-fg); }
  .pc-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 10px; }
  .pc-group { font-family: var(--font-display); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); padding: 10px 8px 4px; }
  .pc-list ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .pc-rowline { display: flex; align-items: flex-start; gap: 2px; border-radius: 12px; }
  .pc-rowline.cur { background: var(--sky-soft); }
  .pc-conv { flex: 1; min-width: 0; text-align: left; display: flex; gap: 10px; align-items: flex-start; padding: 9px 4px 9px 9px; border-radius: 12px; border: 2px solid transparent; background: transparent; }
  .pc-rowline:not(.cur) .pc-conv:hover { background: var(--z50); }
  .pc-conv .tile { width: 30px; height: 30px; margin-top: 1px; }
  .pc-conv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pc-conv-top { display: flex; gap: 6px; align-items: baseline; }
  .pc-conv-title { font-family: var(--font-display); font-weight: 800; font-size: 14.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-rowline.cur .pc-conv-title { color: var(--sky-strong); }
  .pc-conv-time { font-size: 12px; color: var(--muted-fg); flex-shrink: 0; }
  .pc-conv-snip { font-size: 13px; color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-conv-badges { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .pc-more { width: 34px; height: 34px; margin: 8px 6px 0 0; border-radius: 9px; border: 2px solid transparent; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--z700); flex-shrink: 0; }
  .pc-more:hover, .pc-more[aria-expanded="true"] { background: var(--card); border-color: var(--border); }
  .row-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px 8px 48px; }
  .rename-form { display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 10px; border: 2px solid var(--border); border-radius: 12px; background: var(--z50); margin: 2px 0; }
  .rename-form .rf-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .inbox-msg { padding: 14px 10px; font-size: 13.5px; color: var(--muted-fg); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .inbox-card { margin: 8px 4px; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--z50); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; font-size: 13.5px; }
  .inbox-card.err { border-color: var(--clay-line); background: var(--clay-soft); }
  .inbox-card h3 { font-size: 15.5px; }
  .inbox-card p { color: var(--z700); }
  .inbox-empty { margin: 18px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted-fg); }
  .inbox-empty .big { width: 56px; }
  .inbox-empty h3 { font-size: 17px; color: var(--fg); }
  .skel { display: flex; gap: 10px; padding: 10px 9px; }
  .skel i { display: block; border-radius: 8px; background: var(--z100); }
  .skel .s-tile { width: 30px; height: 30px; flex-shrink: 0; }
  .skel .s-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .skel .s-l1 { height: 12px; width: 70%; } .skel .s-l2 { height: 10px; width: 90%; }
  .skel i { animation: pc-pulse 1.4s ease-in-out infinite; }
  @keyframes pc-pulse { 50% { opacity: .45; } }
  .inbox-status { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 4px 2px; padding: 7px 9px; border-radius: 10px; background: var(--z50); border: 2px solid var(--border); font-size: 13px; }
  .inbox-status span { flex: 1; min-width: 120px; }
  .archived-head { display: flex; align-items: center; gap: 8px; padding: 6px 4px 4px; }
  .archived-head h3 { font-size: 14px; flex: 1; }
  .pc-inbox-foot { border-top: 2px solid var(--z100); padding: 10px 12px; position: relative; }
  .pc-conn { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 4px 9px; padding: 7px 9px; border-radius: 12px; border: 2px solid var(--border); background: var(--z50); text-align: left; }
  .pc-conn > .tile { grid-column: 1; grid-row: 1 / span 2; }
  .pc-conn > .conn-main { grid-column: 2; }
  .pc-conn > .badge { grid-column: 2; justify-self: start; max-width: 100%; white-space: normal; }
  .pc-conn:hover { background: var(--z100); }
  .pc-conn .conn-main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .pc-conn .conn-main b { font-family: var(--font-display); font-weight: 800; font-size: 13px; }
  .pc-conn .conn-main span { font-size: 12px; color: var(--muted-fg); }

  .badge { display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-family: var(--font-display); font-weight: 800; white-space: nowrap; border: 1.5px solid transparent; }
  .b-sun { background: var(--attention); color: var(--attention-fg); border-color: var(--attention-border); }
  .b-leaf { background: var(--leaf-soft); color: var(--leaf-strong); }
  .b-sky { background: var(--sky-soft); color: var(--sky-strong); }
  .b-neutral { background: var(--muted); color: var(--z700); }
  .b-grape { background: var(--grape-soft); color: var(--grape-strong); }
  .b-clay { background: var(--clay-soft); color: var(--clay-strong); border-color: var(--clay-line); }
  .b-outline { background: var(--card); color: var(--z700); border-color: var(--border); }

  /* Thread */
  .pc-thread { flex: 1; min-width: 0; display: none; flex-direction: column; position: relative; background: var(--bg); }
  .pc-thread-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card); border-bottom: 2px solid var(--border); min-height: 62px; flex-shrink: 0; }
  .pc-back { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 var(--border); flex-shrink: 0; padding: 0; }
  .pc-thread-titles { flex: 1; min-width: 0; }
  .pc-thread-titles h2 { font-size: 17px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-thread-sub { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px; font-size: 12.5px; color: var(--muted-fg); }
  .pc-log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 760px; width: 100%; }
  .msg.user { justify-content: flex-end; margin-left: auto; flex-direction: column; align-items: flex-end; gap: 0; }
  .msg .avatar { width: 30px; flex-shrink: 0; margin-top: 2px; }
  .bubble-user { background: var(--sky-soft); color: #12324d; border-radius: 16px 16px 4px 16px; padding: 10px 13px; max-width: min(520px, 88%); white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble-user .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; white-space: normal; }
  .msg-time { font-size: 11.5px; color: var(--muted-fg); margin-top: 3px; text-align: right; }
  .sprig-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .sprig-name { font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--leaf-strong); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .sprig-name .when { font-family: var(--font-sans); font-weight: 400; color: var(--muted-fg); font-size: 11.5px; }
  .sprig-p { overflow-wrap: anywhere; }
  .caret { display: inline-block; width: 8px; height: 1.05em; vertical-align: text-bottom; background: var(--primary); margin-left: 2px; border-radius: 2px; animation: pc-blink 1s steps(2) infinite; }
  @keyframes pc-blink { 50% { opacity: 0; } }
  .tools { list-style: none; margin: 0; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--card); border: 2px solid var(--border); border-radius: 12px; font-size: 13px; }
  .tools li { display: flex; gap: 7px; align-items: center; color: var(--z700); }
  .tools li svg { width: 15px; height: 15px; }
  .tools li.done svg { color: var(--primary); }
  .tools li.run { color: var(--sky-strong); font-weight: 600; }
  .tools li.skip { color: var(--muted-fg); }
  .spin { animation: pc-spin 1s linear infinite; }
  @keyframes pc-spin { to { transform: rotate(360deg); } }
  .sprig-ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: pri; }
  .sprig-ol li { counter-increment: pri; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 10px 12px; }
  .sprig-ol li::before { content: counter(pri); width: 24px; height: 24px; border-radius: 8px; background: var(--leaf-soft); color: var(--leaf-strong); font-family: var(--font-display); font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .li-title { font-family: var(--font-display); font-weight: 800; overflow-wrap: anywhere; }
  .li-detail { font-size: 13.5px; color: var(--muted-fg); margin-top: 2px; }
  .li-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .src { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 26px; padding: 0 9px 0 4px; margin: 1px 0; border-radius: 999px; border: 2px solid var(--sky-soft); background: var(--card); color: var(--sky-strong); font-size: 12.5px; font-weight: 600; vertical-align: middle; }
  .src:hover { background: var(--sky-soft); }
  .src .n { width: 18px; height: 18px; border-radius: 50%; background: var(--sky-soft); color: var(--sky-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .src .n svg { width: 11px; height: 11px; }
  .src .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .src.gone { border-style: dashed; border-color: var(--z300); color: var(--z700); }
  .src.gone .n { background: var(--z100); color: var(--z700); }
  .note-line { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--z700); background: var(--z50); border: 2px dashed var(--border); border-radius: 12px; padding: 8px 10px; }
  .note-line svg { width: 16px; height: 16px; margin-top: 1px; }
  .note-line.sun { background: var(--attention); border: 2px solid var(--attention-border); color: var(--attention-fg); }
  .note-line.clay { background: var(--clay-soft); border: 2px solid var(--clay-line); color: var(--clay-strong); }
  .note-line.leaf { background: var(--leaf-soft); border: 2px solid var(--leaf-line); color: var(--leaf-strong); }
  .act-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .peek-meta { display: flex; flex-wrap: wrap; gap: 6px; }

  .err-box { border: 2px solid var(--clay-line); background: var(--clay-soft); color: var(--clay-strong); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
  .err-box b { font-family: var(--font-display); }

  /* Proposal */
  .proposal { background: var(--card); border: 2px solid var(--border); border-radius: 18px; box-shadow: 0 4px 0 var(--border); overflow: hidden; }
  .proposal.pending { border-color: var(--attention-border); box-shadow: 0 4px 0 var(--attention-border); }
  .proposal.approved { border-color: var(--leaf-line); box-shadow: 0 4px 0 var(--leaf-line); }
  .proposal.problem { border-color: var(--clay-line); box-shadow: 0 4px 0 var(--clay-line); }
  .prop-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 10px; flex-wrap: wrap; }
  .prop-head .tile { width: 34px; height: 34px; }
  .prop-head-text { flex: 1; min-width: 170px; }
  .prop-head h3 { font-size: 16px; line-height: 1.25; }
  .prop-head h3:focus { outline: none; }

        map.appendChild(h("button", { type: "button", class: "rv-node", "data-rv": "flow", "data-arg": f.id, "data-rk": "rv:flow:" + f.id, "aria-current": S.caseId === f.id ? "true" : null, "aria-label": (i + 1) + ". " + f.label + ": open " + CASE_BY[f.id].label }, mini(f.art), h("span", { text: (i + 1) + ". " + f.label })));
      });
      panel.appendChild(map);
      var br = h("div", { class: "rv-branches" }, h("b", { text: "Branches:" }));
      BRANCHES.forEach(function (b) { var n = CASES.filter(function (c) { return c.group === b[0]; }).length; br.appendChild(rb(b[1] + " (" + n + ")", "branch", b[0])); });
      panel.appendChild(br);
    }
    if (S.pending) {
      var sim = h("div", { class: "rv-sim", role: "status" }, h("span", { text: "Simulated: " + S.pending.label + (S.pending.auto ? "…" : ".") }));
      if (S.pending.kind === "stream" && !S.pending.auto) sim.appendChild(rb("Play stream", "play"));

  }
  function rvSay(t) { var l = document.getElementById("pcf-rv-live"); l.textContent = ""; setTimeout(function () { l.textContent = t; }, 30); }

  function selectCase(id, opts) {
    if (!CASE_BY[id]) return false;
    clearTimer();
    S = caseState(id);
    if (opts && opts.tab) UI.tab = opts.tab;
    if (UI.tab === "journey") { if (JIDX[id] != null) UI.jStep = JIDX[id]; }
    if (UI.tab === "cases") UI.group = CASE_BY[id].group;
    render.lastConv = null;
    render();
    var log = root.querySelector('[data-scroll="log"]'); if (log) log.scrollTop = log.scrollHeight;
    if (S.main) { var m = byFk(S.main); if (m) scrollIn(m); }
    rvSay("Showing case: " + CASE_BY[id].label + ".");
    return true;
  }

  /* ---------------- Events ---------------- */
  root.addEventListener("click", function (e) {
    var r = e.target.closest("[data-rv]");
    if (r && rvEl.contains(r)) {
      var a = r.getAttribute("data-rv"), g = r.getAttribute("data-arg");
      if (a === "tab") { UI.tab = g; if (g === "cases") UI.group = CASE_BY[S.caseId].group; renderReviewer(); var tb = rvEl.querySelector("#rv-tab-" + g); if (tb) tb.focus(); return; }
      if (a === "reset") { selectCase(S.caseId); rvSay("Preview reset: " + CASE_BY[S.caseId].label + "."); return; }
      if (a === "prev") { UI.jStep = Math.max(0, UI.jStep - 1); selectCase(JOURNEY[UI.jStep].id); return; }
      if (a === "next") { UI.jStep = Math.min(JOURNEY.length - 1, UI.jStep + 1); selectCase(JOURNEY[UI.jStep].id); return; }
      if (a === "group") { UI.group = g; renderReviewer(); return; }
      if (a === "case") { selectCase(g); return; }
      if (a === "flow") { if (JIDX[g] != null) { UI.tab = "journey"; } selectCase(g); return; }
      if (a === "branch") { UI.tab = "cases"; UI.group = g; renderReviewer(); var f1 = rvEl.querySelector(".rv-case"); if (f1) f1.focus(); return; }
      if (a === "settle") { settle(); return; }
      if (a === "play") { playStream(); return; }
      return;
    }
    var el = e.target.closest("[data-act]");
    if (!el || !stageWrap.contains(el) || el.disabled) return;
    var fn = ACT[el.getAttribute("data-act")];
    if (!fn) return;
    fn(el.getAttribute("data-arg"), el);
    if (el.getAttribute("data-act") !== "pick-device") render();
  });
  root.addEventListener("change", function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute("data-rv-sel") === "step") { UI.jStep = +t.value; selectCase(JOURNEY[UI.jStep].id); var s2 = document.getElementById("rv-step"); if (s2) s2.focus(); return; }
    var b = t.getAttribute && t.getAttribute("data-bind"); if (!b) return;
    var p = P(); var task = p && p.edit ? p.edit.filter(function (x) { return x.id === t.getAttribute("data-arg"); })[0] : null;
    if (b === "inc" && task) { task.include = t.checked; if (p.errors[task.id]) delete p.errors[task.id]; render(); }
    if (b === "duekind" && task) { task.due.kind = t.value; if (t.value === "none") task.due.value = ""; if (p.errors[task.id]) delete p.errors[task.id].due; render(); }
    if (b === "dueday" && task) { task.due.value = t.value; if (t.value) task.due.kind = "day"; render(); }
  });
  root.addEventListener("input", function (e) {
    var t = e.target, b = t.getAttribute && t.getAttribute("data-bind"); if (!b) return;
    if (b === "draft") { var c = A(); if (c) { c.draft.text = t.value; var sendB = byFk("send"); var r = canSend(c); if (sendB) sendB.disabled = !r.ok; } return; }
    if (b === "search") { S.inbox.search = t.value; render(); return; }
    if (b === "rename") { S.inbox.rename.value = t.value; return; }
    if (b === "title") { var p = P(); var task = p.edit.filter(function (x) { return x.id === t.getAttribute("data-arg"); })[0]; task.title = t.value; return; }
    if (b === "dueday") { var p2 = P(); var tk = p2.edit.filter(function (x) { return x.id === t.getAttribute("data-arg"); })[0]; tk.due.value = t.value; if (t.value) tk.due.kind = "day"; return; }
  });
  root.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      var order = ["journey", "cases", "map"]; var i = order.indexOf(UI.tab); i = (i + (e.key === "ArrowRight" ? 1 : 2)) % 3; UI.tab = order[i];
      if (UI.tab === "cases") UI.group = CASE_BY[S.caseId].group; renderReviewer(); document.getElementById("rv-tab-" + UI.tab).focus(); e.preventDefault(); return;
    }
    if (!stageWrap.contains(t) && e.key !== "Escape") return;
    if (e.key === "Enter" && t.getAttribute("data-bind") === "draft" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ACT.send(); render(); return; }
    if (e.key === "Enter" && t.getAttribute("data-bind") === "rename") { e.preventDefault(); ACT["rename-save"](); render(); return; }
    if (e.key === "Tab" && S.screen) {
      var ov = root.querySelector("[data-overlay]"); if (!ov) return;
      var f = Array.prototype.filter.call(ov.querySelectorAll("button, [tabindex='-1'][data-fk='consent-title']"), function (x) { return !x.disabled && x.tagName === "BUTTON"; });
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      else if (!ov.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); }
      return;
    }
    if (e.key !== "Escape" || !stageWrap.contains(t)) return;
    var handled = true;
    if (S.screen === "consent" && !S.connBusy) ACT["consent-decline"]();
    else if (S.screen) handled = false;
    else if (S.pop) { var map = { attach: "pop-attach", ctx: "pop-ctx", conn: "conn" }; S.focus = map[S.pop]; S.pop = null; }
    else if (S.inbox.rename) ACT["rename-cancel"]();
    else if (S.inbox.menu) { S.focus = "more:" + S.inbox.menu; S.inbox.menu = null; }
    else if (S.peek) ACT["close-peek"]();
    else handled = false;
    if (handled) { e.preventDefault(); render(); }
  });

  /* ---------------- Design-only QA API ---------------- */
  window.pcFlowDemo = {

    journey: function () { return JOURNEY.map(function (j, i) { return { step: i + 1, id: j.id, label: CASE_BY[j.id].label }; }); },
    selectCase: function (id) { return selectCase(id); },
    reset: function () { return selectCase(S.caseId); },
    settle: function () { settle(); return this.getState(); },
    getState: function () {
      var c = A(), p = c && c.proposal;
      return {
        case: S.caseId, stage: S.stage, mainAction: S.main, reviewerTab: UI.tab, journeyStep: UI.jStep + 1, journeyStepId: JOURNEY[UI.jStep].id,
        view: S.view, phoneFrame: S.phone, screen: S.screen, connection: S.conn, network: S.network, usage: S.usage, appSession: S.appSession,
        inbox: { status: S.inbox.status, search: S.inbox.search, visible: S.convs.filter(function (x) { return !x.archived; }).map(function (x) { return x.title; }), archived: S.convs.filter(function (x) { return x.archived; }).map(function (x) { return x.title; }), archivedView: S.inbox.archivedView },
        activeConversation: c ? { id: c.id, title: c.title, context: c.ctx, userMessages: c.messages.filter(function (m) { return m.role === "user"; }).length,
          lastReply: (function () { var m = c.messages.filter(function (x) { return x.role === "sprig"; }).pop(); return m ? { status: m.status, script: m.script || null } : null; })(),
          draft: c.draft.text, attachments: c.draft.atts.map(function (a) { return { name: a.name, status: a.status, error: a.error || "" }; }) } : null,
        proposal: p ? { status: p.status, edited: p.edited, execKey: p.execKey, receipt: p.receipt ? p.receipt.id : null, saved: p.saved ? p.saved.length : 0,
          tasks: (p.edit || p.tasks).map(function (t) { return { id: t.id, title: t.title, include: t.include, dueDate: t.due.kind === "day" ? t.due.value : null, note: t.note || null }; }), errors: p.errors, formError: p.formError } : null,
        workflow: c && c.workflow ? c.workflow.items.map(function (i) { return { id: i.id, status: i.status, receipt: i.receipt }; }) : null,
        peek: S.peek ? { type: S.peek.type, id: S.peek.id } : null, popover: S.pop, pending: S.pending ? { kind: S.pending.kind, auto: !!S.pending.auto } : null
      };
    }
  };

  /* Optional deep link: #<case-id> (e.g. #proposal-conflict), plus #<case-id>&tab=cases|map */
  (function () {
    var hs = (location.hash || "").replace(/^#/, "").split("&"), id = hs[0], tab = null;
    hs.slice(1).forEach(function (kv) { var m = /^tab=(journey|cases|map)$/.exec(kv); if (m) tab = m[1]; });
    if (tab) UI.tab = tab;
    selectCase(CASE_BY[id] ? id : "setup-required");
  })();
})();
